# این فایل حداقل سرویس‌های لازم را تعریف می‌کند: backend و PostgreSQL.
# Redis/Celery فقط زمانی اضافه می‌شوند که فازی به آن‌ها واقعاً نیاز پیدا کند
# (مثلاً پردازش Async قیمت‌های بازار)، نه از قبل و بدون دلیل.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # پورت دیتابیس به بیرون از شبکه‌ی Docker منتشر نمی‌شود؛ فقط backend که در
    # همین شبکه‌ی داخلی است به آن دسترسی دارد (کاهش سطح حمله).
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
